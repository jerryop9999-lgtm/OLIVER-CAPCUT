name: Android Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: OLIVER-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - name: Build signed Release APK (only if KEYSTORE_BASE64 secret is set)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with: { name: OLIVER-release-apk, path: app/build/outputs/apk/release/*.apk }
      - name: Build status
        if: always()
        run: echo "OLIVER build finished with status ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
